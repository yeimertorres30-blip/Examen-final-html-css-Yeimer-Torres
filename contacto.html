<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/Logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>Contacto</title>
</head>

<body>
    <main>
        <header class="encabezado">
            <h1><a href="index.html"><img src="img/Logo.png" alt="Logo" style="height: 100px; "></a> <span
                    class="color">Eco <span>vida</span></span></h1>
        </header>
        <nav class="navegacion">
            <a href="index.html" class="enlace">inicio</a>
            <a href="nosotros.html" class="enlace">nosotros</a>
            <a href="catalogo.html" class="enlace">catalogo</a>
            <a href="contacto.html" class="enlace">contacto</a>
        </nav>
        <section class="contacto">
            <h2>Contacto</h2>
            <p>Si tienes alguna pregunta o deseas obtener más información sobre nuestros productos, no dudes en
                contactarnos. Estamos aquí para ayudarte.</p>
            <form class="formulario" onsubmit="enviarFormulario(event)">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <button type="submit">Enviar</button>

                <p id="mensaje-enviado"></p>

            </form>
    </main>
    <footer>
        <p>&copy; 2026 Eco Vida. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
